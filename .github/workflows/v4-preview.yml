name: v4 Preview direction regression

on:
  push:
    branches: [autopilot]
    paths:
      - 'src/markdown.js'
      - 'src/direction.js'
      - 'src/preview-runtime.js'
      - 'src/app.js'
      - 'index.html'
      - 'styles.css'
      - 'tests/**'
      - '.github/workflows/v4-preview.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Node regression suite
        run: node --test tests/*.test.js
      - name: Browser-computed blockquote direction
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$browser" ]]; then
            echo "::error::Chrome/Chromium not installed on runner"
            exit 1
          fi
          output="$PWD/v4-blockquote-dom.html"
          timeout 45s "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --virtual-time-budget=5000 \
            --dump-dom "file://$PWD/tests/blockquote.browser.html" > "$output"
          # Capture evidence even if an assertion fails, so CI failures are diagnosable.
          timeout 45s "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --virtual-time-budget=5000 \
            --window-size=1100,800 \
            --screenshot="$PWD/v4-browser-regression.png" \
            "file://$PWD/tests/blockquote.browser.html"
          if ! grep -q 'data-failures="0"' "$output" || ! grep -q 'data-executed="5"' "$output"; then
            echo "::error::Computed-style blockquote regression did not pass"
            grep -E 'data-failures=|FAIL:|Running tests' "$output" || true
            exit 1
          fi
          echo "Computed-style blockquote tests passed in $browser"
      - name: Browser live-preview integration
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          browser="$(command -v google-chrome || command -v chromium || true)"
          if [[ -z "$browser" ]]; then
            echo "::error::Chrome/Chromium not installed on runner"
            exit 1
          fi
          output="$PWD/v4-live-preview-dom.html"
          timeout 45s "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --virtual-time-budget=5000 \
            --dump-dom "file://$PWD/tests/live-preview.browser.html" > "$output"
          # Preserve the rendered editor/preview fixture for visual inspection.
          timeout 45s "$browser" --headless --no-sandbox --disable-gpu \
            --disable-dev-shm-usage --virtual-time-budget=5000 \
            --window-size=1100,900 --screenshot="$PWD/v4-live-preview.png" \
            "file://$PWD/tests/live-preview.browser.html"
          if ! grep -q 'data-failures="0"' "$output" || ! grep -q 'data-executed="34"' "$output"; then
            echo "::error::Live preview integration regression did not pass"
            grep -E 'data-failures=|FAIL:|Running tests' "$output" || true
            exit 1
          fi
          echo "Live preview integration tests passed in $browser"
      - name: Publish browser regression screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-browser-regression
          path: |
            v4-browser-regression.png
            v4-live-preview.png
            v4-blockquote-dom.html
            v4-live-preview-dom.html
          if-no-files-found: ignore
